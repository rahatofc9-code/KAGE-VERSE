<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Watch - KAGE-VERSE</title>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header>

        <a href="index.html" class="logo">
            KAGE-VERSE
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="anime.html">
                Anime
            </a>

            <a href="movies.html">
                Movies
            </a>

            <a href="search.html">
                Search
            </a>

        </nav>

    </header>


    <!-- =========================
         WATCH PAGE
    ========================== -->

    <main>

        <section class="watch-page">

            <!-- Video -->

            <div class="video-container">

                <iframe
                    id="videoFrame"
                    src=""
                    allow="autoplay; fullscreen; picture-in-picture"
                    allowfullscreen
                    title="Anime Video">
                </iframe>

            </div>


            <!-- Anime Information -->

            <div class="watch-info">

                <p class="details-label">
                    NOW WATCHING
                </p>

                <h1 id="animeTitle">
                    Loading...
                </h1>

                <p id="animeType">
                    Loading...
                </p>

            </div>


            <!-- Back Button -->

            <div class="watch-actions">

                <a
                    href="anime.html"
                    class="back-button">
                    ← Back to Anime
                </a>

            </div>

        </section>
        

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
